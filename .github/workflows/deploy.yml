name: Deploy

on:
  push:
    tags:
      # Matches calendar version tags: YYYY.MM.DD and YYYY.MM.DD.N
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*'

permissions:
  id-token: write  # Required for OIDC token exchange
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::600893692809:role/github-actions-personal-website
          role-duration-seconds: 900
          aws-region: us-east-1

      # Fingerprinted assets (/_astro/*) never change, so browsers may cache them for a year.
      # Everything else (HTML, feeds, sitemap) must revalidate so new posts show up immediately.
      - name: Sync to S3
        run: |
          aws s3 sync ./dist/_astro s3://www-main-600893692809-us-east-1-an/_astro \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./dist s3://www-main-600893692809-us-east-1-an \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E10RLKEBI6IH3R \
            --paths "/*"
