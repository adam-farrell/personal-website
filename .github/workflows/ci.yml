name: CI

# Builds and checks pull requests into main without deploying.
# Deploys only happen from deploy.yml when a release tag is pushed.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm test

      - name: Type check, lint and format check
        run: npm run check
