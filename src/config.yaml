site:
  name: Adam Farrell
  site: 'https://adamfarrell.org'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null # add your Google Search Console token here

# Default SEO metadata
metadata:
  title:
    default: Adam Farrell
    template: '%s — Adam Farrell'
  description: 'Adam Farrell is a Senior Principal Software Engineer at Nike writing about cloud platforms, AWS and experiments in tech.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Adam Farrell
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 9

    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
